name: Visual browser smoke — Pixi crochet
on:
  push:
    branches: [feature/crochet-atlas-pixi-rebuild]
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright-core@1.56.1 --no-audit --no-fund
      - name: Launch Vite and capture actual browser render
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite-crochet.log 2>&1 &
          node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixi-browser-screenshots
          path: screenshots/
          if-no-files-found: ignore
